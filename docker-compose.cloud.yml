services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["127.0.0.1:3000:80"]
    volumes: ["./server/nginx.cloud.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: server/.env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://canvas:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/canvas
      S3_ENDPOINT: http://s3:9000
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_started }
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: canvas
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["canvas-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas -d canvas"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  s3:
    build:
      context: .
      dockerfile: server/Dockerfile.s3
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["canvas-media:/data"]
    restart: unless-stopped
volumes:
  canvas-postgres:
  canvas-media:
